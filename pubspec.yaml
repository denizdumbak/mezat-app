name: mezat_app
description: "Live-streamed auction app built with Flutter, Supabase and LiveKit."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

# Versions are pinned exactly (no caret) so builds are reproducible.
dependencies:
  flutter:
    sdk: flutter
  # Material and Cupertino texts (date pickers, tooltips) in Turkish.
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  go_router: 17.5.0
  # Already pulled in by supabase_flutter; declared because supabase_errors.dart
  # matches its ClientException (network failures). Same version as resolved.
  http: 1.6.0
  # Picks the auction photo from the gallery (official flutter.dev package).
  image_picker: 1.2.4
  supabase_flutter: 2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app on a device/desktop (integration_test/).
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Demo photos for the mock catalogue (MOCK_FEED, tests, screenshots).
  assets:
    - assets/mock/

  # Bundled instead of fetched at runtime (google_fonts): works offline, no
  # request to Google on launch, and tests can check the glyphs. SIL OFL 1.1,
  # licence next to the files. One family: Manrope.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
