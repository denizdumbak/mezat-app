name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with the local SDK (see README).
          flutter-version: 3.41.4
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
